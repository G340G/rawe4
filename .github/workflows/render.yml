name: Render ARG video (fast)

on:
  workflow_dispatch:
  schedule:
    # Every Monday 03:00 UTC (adjust if you want)
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: arg-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg espeak-ng fonts-dejavu-core
          ffmpeg -version
          espeak-ng --version || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Render video
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python arg_video.py
          ls -lah output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arg-video
          path: output/*.mp4
          if-no-files-found: error

